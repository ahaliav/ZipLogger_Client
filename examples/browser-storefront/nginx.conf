server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The checkout API is proxied under the storefront's own origin. That keeps the
    # browser call same-origin, so instrumentFetch propagates its traceparent header
    # without extra configuration and no CORS preflight is involved.
    location /checkout/ {
        proxy_pass         http://checkout:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # config.js is generated at container start and must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
